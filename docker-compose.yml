name: hestia

services:
  app:
    build: .
    container_name: hestia-app
    env_file: .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/hestia.db
      - UPLOAD_DIR=/app/uploads
      - FRONTEND_DIST=/app/static
      - TZ=${TZ:-UTC}
      - PISTON_URL=http://piston:2000
      - SEARXNG_URL=${SEARXNG_URL:-}
      - EMBEDDING_URL=${EMBEDDING_URL:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ${UPLOAD_DIR:-./uploads}:/app/uploads
    ports:
      - "${WEB_PORT:-8080}:8000"
    restart: unless-stopped

  piston:
    image: ghcr.io/engineer-man/piston
    container_name: hestia-piston
    privileged: true
    restart: unless-stopped
    environment:
      - PISTON_RUN_TIMEOUT=60000
      - PISTON_RUN_CPU_TIME=60000
      - PISTON_COMPILE_TIMEOUT=60000
      - PISTON_COMPILE_CPU_TIME=60000
      - PISTON_OUTPUT_MAX_SIZE=1048576
    ports:
      - "2000:2000"
    volumes:
      - ./piston/packages:/piston/packages
      - ./piston/entrypoint.sh:/piston/entrypoint.sh:ro
      - ./piston/init.js:/piston/init.js:ro
    tmpfs:
      - /tmp:exec
    command: ["bash", "/piston/entrypoint.sh"]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:2000/api/v2/runtimes',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
