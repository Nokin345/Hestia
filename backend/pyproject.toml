[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hestia-backend"
version = "0.1.0"
description = "Hestia chatbot webui backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.31",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "httpx>=0.27.0",
    "itsdangerous>=2.2.0",
    "sse-starlette>=2.1.0",
    "python-multipart>=0.0.9",
    "passlib[bcrypt]>=1.7.4",
    "chromadb>=0.5.0",
    "fastembed>=0.3.5",
    "pypdf>=4.0.0",
    "pymupdf>=1.24.0",
    "rapidocr-onnxruntime>=1.3.20",
    "mcp>=1.28,<2",
]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP", "RUF"]
ignore = ["B008"]
